services:
  postgres:
    image: postgres:16-alpine
    container_name: ehpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ehpad}
      POSTGRES_USER: ${DB_USER:-ehpad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ehpad}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
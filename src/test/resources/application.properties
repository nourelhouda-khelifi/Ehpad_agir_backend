# ── Testcontainers : démarre un vrai PostgreSQL pour les tests ─────────────
# Le driver TC lit "16-alpine" et lance le container automatiquement
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///ehpad_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Props requises par DataInitializer et JwtUtil
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktbm90LWZvci1wcm9kdWN0aW9u
jwt.expiration=86400000
app.admin.password=TestAdmin1!
app.infirmiere.password=TestInf1!

# Pas d'import .env en tests (pas de fichier .env dans CI)
spring.config.import=

spring.application.name=Ehpad

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ehpad}
spring.datasource.username=${DB_USER:ehpad}
spring.datasource.password=${DB_PASSWORD:ehpad}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration (disabled for now - using Hibernate DDL)
spring.flyway.enabled=false

# ────────────────────────────────────────────────────────────────────────────
#  EHPAD Agir — Configuration Spring Boot (PostgreSQL uniquement)
#  Toutes les valeurs sensibles viennent du fichier .env
# ────────────────────────────────────────────────────────────────────────────

spring.application.name=Ehpad
spring.config.import=optional:file:.env[.properties]

# ── Serveur ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ── Base de données PostgreSQL ────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ehpad}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:ehpad}
spring.datasource.password=${DB_PASSWORD:ehpad}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway — seul gestionnaire du schéma ─────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Comptes par défaut (mots de passe depuis .env) ───────────────────────────
app.admin.password=${APP_ADMIN_PASSWORD}
app.infirmiere.password=${APP_INFIRMIERE_PASSWORD}
